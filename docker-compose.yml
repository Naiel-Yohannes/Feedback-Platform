services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres212
      POSTGRES_DB: feedback_platform
    ports:
      - "5432:5432"
    volumes:
     - postgres-data:/var/lib/postgresql/data
  
  backend:
    build: ./Backend
    depends_on:
      - postgres
    environment:
      - POSTGRES_URI=postgresql://postgres:postgres212@postgres:5432/feedback_platform
    ports:
      - "5001:5001"

  frontend:
    build: ./Frontend
    depends_on:
      - backend
    environment:
      - VITE_API_URL=https://feedback-platform-backend-docker.onrender.com
    ports:
      - "5173:5173"

    volumes:
      postgres-data:
